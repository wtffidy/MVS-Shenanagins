name: Tizen TV Probe Validation

on:
  push:
    paths:
      - "src/Skua.Tizen.TV.Probe/**"
      - ".github/workflows/tizen-probe-validation.yml"
  pull_request:
    paths:
      - "src/Skua.Tizen.TV.Probe/**"
      - ".github/workflows/tizen-probe-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate WGT source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check src/Skua.Tizen.TV.Probe/app.js

      - name: Validate Tizen manifest and packaged assets
        run: python3 src/Skua.Tizen.TV.Probe/validate.py
