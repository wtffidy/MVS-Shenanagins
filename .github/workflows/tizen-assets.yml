name: Tizen asset validation

on:
  push:
    branches:
      - feature/tizen-tv-family-hub
    paths:
      - ".github/workflows/tizen-assets.yml"
      - "src/Skua.Flash.Ruffle/**"
      - "src/Skua.Core/**"
      - "src/Skua.Core.Interfaces/**"
      - "src/Skua.Core.Models/**"
      - "src/Skua.Core.Utils/**"
      - "src/tools/RuffleAssetPack/**"
      - "src/Tizen/**"
  pull_request:
    paths:
      - ".github/workflows/tizen-assets.yml"
      - "src/Skua.Flash.Ruffle/**"
      - "src/Skua.Core/**"
      - "src/Skua.Core.Interfaces/**"
      - "src/Skua.Core.Models/**"
      - "src/Skua.Core.Utils/**"
      - "src/tools/RuffleAssetPack/**"
      - "src/Tizen/**"

jobs:

  family-hub-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pin the .NET 8 SDK for the Tizen workload
        shell: bash
        run: |
          sdk_version="$(dotnet --list-sdks | awk 'index($1, "8.0.") == 1 { version = $1 } END { print version }')"
          if [ -z "$sdk_version" ]; then
            echo "No .NET 8 SDK was found."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/tizen-workload"
          printf '{ "sdk": { "version": "%s", "rollForward": "latestPatch" } }\n' "$sdk_version" > "$RUNNER_TEMP/tizen-workload/global.json"
          echo "Using .NET SDK $sdk_version for the Tizen workload."

      - name: Install Samsung Tizen .NET workload
        working-directory: ${{ runner.temp }}/tizen-workload
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/Samsung/Tizen.NET/main/workload/scripts/workload-install.sh | sudo bash

      - name: Build the native Family Hub application
        working-directory: ${{ runner.temp }}/tizen-workload
        env:
          HOME: ${{ runner.temp }}/dotnet-home
          DOTNET_CLI_HOME: ${{ runner.temp }}/dotnet-home
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg-runtime
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
        run: |
          mkdir -p "$HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          dotnet build "$GITHUB_WORKSPACE/src/Tizen/FamilyHub/Mvs.FamilyHub.csproj" --configuration Release --framework net8.0-tizen10.0

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 and 10 SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the shared runtime for Tizen .NET 8
        run: dotnet build src/tools/RuffleAssetPack/RuffleAssetPack.csproj --framework net8.0 --configuration Release

      - name: Build the existing shared runtime for .NET 10
        run: dotnet build src/tools/RuffleAssetPack/RuffleAssetPack.csproj --framework net10.0 --configuration Release

      - name: Export patched Ruffle assets
        run: dotnet run --project src/tools/RuffleAssetPack/RuffleAssetPack.csproj --framework net10.0 --configuration Release -- "$RUNNER_TEMP/mvs-tizen-assets"

      - name: Validate Samsung TV client JavaScript
        run: node --check src/Tizen/Shared/app.js

      - name: Validate Family Hub client JavaScript
        run: node --check src/Tizen/FamilyHub/res/web/app.js

      - name: Validate Tizen package manifests
        run: |
          python -c "import xml.etree.ElementTree as ET; ET.parse('src/Tizen/TV/config.xml')"
          python -c "import xml.etree.ElementTree as ET; ET.parse('src/Tizen/FamilyHub/tizen-manifest.xml')"

      - name: Verify Family Hub packaged resources
        run: |
          test -s src/Tizen/FamilyHub/res/web/index.html
          test -s src/Tizen/FamilyHub/res/web/app.css
          test -s src/Tizen/FamilyHub/res/web/app.js

      - name: Verify exported client assets
        run: |
          test -s "$RUNNER_TEMP/mvs-tizen-assets/ruffle/ruffle.js"
          test -s "$RUNNER_TEMP/mvs-tizen-assets/ruffle/ruffle_web_bg.DOUD4ENO.wasm"
          test -s "$RUNNER_TEMP/mvs-tizen-assets/skua.swf"

      - name: Upload exported Ruffle assets
        uses: actions/upload-artifact@v4
        with:
          name: mvs-tizen-ruffle-assets
          path: ${{ runner.temp }}/mvs-tizen-assets
          if-no-files-found: error
